services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: super_shiharai_kun
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d

volumes:
  postgres_data: