ktor:
    application:
        modules:
            - com.example.ApplicationKt.module
    deployment:
        port: 8080

database:
  migration_strategy: ${DATABASE_MIGRATION_STRATEGY:exposed}  # flyway,exposed,none

postgres:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/super_shiharai_kun}
  user: ${POSTGRES_USER:myuser}
  password: ${POSTGRES_PASSWORD:mypassword}

jwt:
  domain: "https://super-shiharai-kun.example.com"
  audience: "super-shiharai-kun-api"
  realm: "スーパー支払い君API"
  secret: ${JWT_SECRET:change-this-in-production}

app:
  development: ${APP_DEVELOPMENT:true}  # 開発モード有効/無効制御
