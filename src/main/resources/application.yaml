ktor:
    application:
        modules:
            - com.example.ApplicationKt.module
    deployment:
        port: 8080

database:
  migration_strategy: ${DATABASE_MIGRATION_STRATEGY:exposed}  # flyway,exposed,none

postgres:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/super_shiharai_kun}
  user: ${POSTGRES_USER:myuser}
  password: ${POSTGRES_PASSWORD:mypassword}

jwt:
  domain: "https://jwt-provider-domain/"
  audience: "jwt-audience"
  realm: "ktor sample app"
