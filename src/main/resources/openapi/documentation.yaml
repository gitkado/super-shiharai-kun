openapi: "3.0.3"
info:
  title: "スーパー支払い君 API"
  description: "支払い管理システムのREST API。JWT認証による安全な請求書管理機能を提供します。手数料4%と手数料に対する消費税10%が自動計算されます。"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
    description: "Development server"

paths:
  /v1/auth/register:
    post:
      tags:
        - "Authentication"
      summary: "ユーザー登録"
      description: "新しい企業ユーザーを登録します"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              example:
                value:
                  companyName: "株式会社サンプル"
                  name: "山田太郎"
                  email: "yamada@sample.com"
                  password: "SecurePass123!"
      responses:
        "201":
          description: "ユーザー登録成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAuthResponse"
              examples:
                success:
                  value:
                    id: 1
                    companyName: "株式会社サンプル"
                    name: "山田太郎"
                    email: "yamada@sample.com"
                    createdAt: "2024-01-01T00:00:00Z"
        "400":
          description: "バリデーションエラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  value:
                    errors:
                      - field: "email"
                        message: "Invalid email format"
                      - field: "password"
                        message: "Password must be at least 8 characters"

  /v1/auth/login:
    post:
      tags:
        - "Authentication"
      summary: "ユーザーログイン"
      description: "メールアドレスとパスワードでログインし、JWTアクセストークンを取得します"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              example:
                value:
                  email: "yamada@sample.com"
                  password: "SecurePass123!"
      responses:
        "200":
          description: "ログイン成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                success:
                  value:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    tokenType: "Bearer"
                    expiresIn: 86400
        "400":
          description: "バリデーションエラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  value:
                    errors:
                      - field: "email"
                        message: "Invalid email format"
        "401":
          description: "認証エラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth_error:
                  value:
                    errors:
                      - field: "credentials"
                        message: "Invalid email or password"

  /v1/payable/invoices:
    post:
      tags:
        - "Invoice"
      summary: "請求書登録"
      description: "新しい請求書を登録します。手数料4%と手数料に対する消費税10%が自動計算されます。認証が必要です。"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInvoiceRequest"
            examples:
              example:
                value:
                  issueDate: "2024-01-15"
                  paymentAmount: 10000.00
                  paymentDueDate: "2024-02-15"
      responses:
        "201":
          description: "請求書登録成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
              examples:
                success:
                  value:
                    id: 1
                    issueDate: "2024-01-15"
                    paymentAmount: 10000.00
                    fee: 400.00
                    feeRate: 0.04
                    taxAmount: 40.00
                    taxRate: 0.10
                    totalAmount: 10440.00
                    paymentDueDate: "2024-02-15"
                    createdAt: "2024-01-15T10:00:00+09:00"
                    updatedAt: "2024-01-15T10:00:00+09:00"
        "400":
          description: "バリデーションエラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  value:
                    errors:
                      - field: "paymentAmount"
                        message: "Payment amount must be positive"
                      - field: "paymentDueDate"
                        message: "Payment due date must not be before issue date"
        "401":
          description: "認証エラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth_error:
                  value:
                    errors:
                      - field: "auth"
                        message: "Invalid token"
    get:
      tags:
        - "Invoice"
      summary: "請求書一覧取得"
      description: "ログイン中のユーザーの請求書一覧を取得します。支払期日による絞り込みが可能です。認証が必要です。"
      security:
        - bearerAuth: []
      parameters:
        - name: paymentDueFrom
          in: query
          description: "支払期日の範囲指定（開始日）"
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: paymentDueTo
          in: query
          description: "支払期日の範囲指定（終了日）"
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        "200":
          description: "請求書一覧取得成功"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceResponse"
              examples:
                success:
                  value:
                    - id: 1
                      issueDate: "2024-01-15"
                      paymentAmount: 10000.00
                      fee: 400.00
                      feeRate: 0.04
                      taxAmount: 40.00
                      taxRate: 0.10
                      totalAmount: 10440.00
                      paymentDueDate: "2024-02-15"
                      createdAt: "2024-01-15T10:00:00+09:00"
                      updatedAt: "2024-01-15T10:00:00+09:00"
                    - id: 2
                      issueDate: "2024-01-20"
                      paymentAmount: 5000.00
                      fee: 200.00
                      feeRate: 0.04
                      taxAmount: 20.00
                      taxRate: 0.10
                      totalAmount: 5220.00
                      paymentDueDate: "2024-02-20"
                      createdAt: "2024-01-20T14:30:00+09:00"
                      updatedAt: "2024-01-20T14:30:00+09:00"
                empty_list:
                  value: []
        "400":
          description: "バリデーションエラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  value:
                    errors:
                      - field: "validation"
                        message: "Invalid date format. Use YYYY-MM-DD"
        "401":
          description: "認証エラー"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth_error:
                  value:
                    errors:
                      - field: "auth"
                        message: "Invalid token"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - companyName
        - name
        - email
        - password
      properties:
        companyName:
          type: string
          description: "会社名"
          example: "株式会社サンプル"
        name:
          type: string
          description: "ユーザー名"
          example: "山田太郎"
        email:
          type: string
          format: email
          description: "メールアドレス"
          example: "yamada@sample.com"
        password:
          type: string
          format: password
          description: "パスワード（8文字以上）"
          example: "SecurePass123!"

    RegisterAuthResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "ユーザーID"
          example: 1
        companyName:
          type: string
          description: "会社名"
          example: "株式会社サンプル"
        name:
          type: string
          description: "ユーザー名"
          example: "山田太郎"
        email:
          type: string
          format: email
          description: "メールアドレス"
          example: "yamada@sample.com"
        createdAt:
          type: string
          format: date-time
          description: "作成日時"
          example: "2024-01-01T00:00:00Z"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: "メールアドレス"
          example: "yamada@sample.com"
        password:
          type: string
          format: password
          description: "パスワード"
          example: "SecurePass123!"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWTアクセストークン"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: "トークンタイプ"
          example: "Bearer"
          default: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: "トークンの有効期限（秒）"
          example: 86400

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "エラーが発生したフィールド名"
          example: "email"
        message:
          type: string
          description: "エラーメッセージ"
          example: "Invalid email format"

    RegisterInvoiceRequest:
      type: object
      required:
        - issueDate
        - paymentAmount
        - paymentDueDate
      properties:
        issueDate:
          type: string
          format: date
          description: "発行日"
          example: "2024-01-15"
        paymentAmount:
          type: number
          format: decimal
          description: "支払金額"
          example: 10000.00
        paymentDueDate:
          type: string
          format: date
          description: "支払期日"
          example: "2024-02-15"

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "請求書ID"
          example: 1
        issueDate:
          type: string
          format: date
          description: "発行日"
          example: "2024-01-15"
        paymentAmount:
          type: number
          format: decimal
          description: "支払金額"
          example: 10000.00
        fee:
          type: number
          format: decimal
          description: "手数料（支払金額の4%）"
          example: 400.00
        feeRate:
          type: number
          format: decimal
          description: "手数料率"
          example: 0.04
        taxAmount:
          type: number
          format: decimal
          description: "消費税（手数料の10%）"
          example: 40.00
        taxRate:
          type: number
          format: decimal
          description: "消費税率"
          example: 0.10
        totalAmount:
          type: number
          format: decimal
          description: "請求金額（支払金額+手数料+消費税）"
          example: 10440.00
        paymentDueDate:
          type: string
          format: date
          description: "支払期日"
          example: "2024-02-15"
        createdAt:
          type: string
          format: date-time
          description: "作成日時"
          example: "2024-01-15T10:00:00+09:00"
        updatedAt:
          type: string
          format: date-time
          description: "更新日時"
          example: "2024-01-15T10:00:00+09:00"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Bearer認証。ログインエンドポイントで取得したアクセストークンをAuthorizationヘッダーに'Bearer {token}'の形式で指定してください。"

security:
  - bearerAuth: []