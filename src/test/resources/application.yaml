ktor:
    application:
        modules:
            - com.example.ApplicationKt.module
    deployment:
        port: 8080

database:
  migration_strategy: "none"  # テストでは何もしない

postgres:
  url: "jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE"  # H2 PostgreSQLモード
  user: test
  password: test

jwt:
  domain: "https://jwt-provider-domain/"
  audience: "jwt-audience"
  realm: "ktor sample app"